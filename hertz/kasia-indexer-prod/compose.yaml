name: kasia_indexer_prod

services:
  kasia_indexer_prod:
    image: ${CHATS_INDEXER_IMAGE:?CHATS_INDEXER_IMAGE must be the tested immutable image ID}
    container_name: kasia_indexer_prod
    pull_policy: never
    restart: unless-stopped
    environment:
      KASIA_INDEXER_DB_ROOT: /app/data
      KASPA_NODE_WBORSH_URL: ws://kaspad_mainnet:17110
      NETWORK_TYPE: mainnet
      KASIA_API_BIND: 0.0.0.0:8080
      PUSH_AUTH_MODE: strict
      # Native Android FCM registration is owned by the wallet's Firebase app.
      # Chain environment does not select a different Firebase sender project.
      FCM_PROJECT_ID: kasanova-io
      FCM_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
      APNS_TEAM_ID: 3G9H3Z5AP4
      APNS_KEY_ID: A7N29TZ7AP
      APNS_TOPIC: io.kasanova.wallet
      APNS_ENVIRONMENT: production
      APNS_KEY_PATH: /run/secrets/apns-key.p8
      RUST_BACKTRACE: "1"
      RUST_LOG: info
    expose:
      - "8080"
    volumes:
      - kasia_indexer_prod_data:/app/data
      - ${FCM_SERVICE_ACCOUNT_HOST_PATH:?FCM_SERVICE_ACCOUNT_HOST_PATH is required}:/run/secrets/firebase-service-account.json:ro
      - ${APNS_KEY_HOST_PATH:?APNS_KEY_HOST_PATH is required}:/run/secrets/apns-key.p8:ro
    networks:
      - caddy_caddy_net
    stop_signal: SIGINT
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      io.kasanova.environment: prod
      io.kasanova.source-revision: ${DEPLOYMENT_REVISION:?DEPLOYMENT_REVISION is required}
    mem_limit: 2g
    cpus: 2

volumes:
  kasia_indexer_prod_data:
    name: kasia_indexer_prod_data

networks:
  caddy_caddy_net:
    external: true
