# Owned retention over the existing source. This service starts no chain scan.
services:
  retention:
    profiles: [retention]
    image: ${PROTOCOL_ADAPTER_IMAGE:?tested immutable adapter required}
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    entrypoint: [python, /run/maintenance/retention_loop.py]
    command: [--network, '${PROTOCOL_NETWORK:?required}', --retention-hours, '${PROTOCOL_RAW_RETENTION_HOURS:-24}']
    environment:
      PROTOCOL_DATABASE_URL: postgres://protocol:${PROTOCOL_DB_PASSWORD:?required}@database:5432/protocol
      SIMPLY_METRICS_URL: http://indexer:8501/api/metrics
    volumes:
      - type: bind
        source: ./source-binding.json
        target: /run/protocol-indexer/source-binding.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./retention_loop.py
        target: /run/maintenance/retention_loop.py
        read_only: true
        bind: {create_host_path: false}
    networks: [protocol]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 90s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
