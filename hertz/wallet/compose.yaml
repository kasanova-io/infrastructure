services:
  wallet-prod:
    image: kasanova/platform-web:cfg-682ce8f5e97a
    container_name: kasanova_wallet_prod
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    environment:
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
      PUBLIC_UPSTREAM: public_prod:80
      PUBLIC_API_HOST: api.kasanova.io
      PUBLIC_CONFIG_API_KEY: ${PUBLIC_CONFIG_API_KEY:?Server-side PROD environment-read key required}
      PLATFORM_APP_VERSION: 0.9.0
    volumes:
      - ${PLATFORM_RELEASE_DIR:?Verified PROD artifact directory required}:/srv:ro
      - ./site.Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [caddy_caddy_net]
    labels:
      io.kasanova.service: wallet-prod
      io.kasanova.source-manifest-sha256: ${PLATFORM_SOURCE_MANIFEST_SHA256:?Source manifest required}
      io.kasanova.artifact-sha256: ${PLATFORM_ARTIFACT_SHA256:?Artifact hash required}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/version.json]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  caddy_caddy_net:
    external: true
