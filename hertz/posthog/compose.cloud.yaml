name: kasanova_analytics
services:
  relay:
    image: ${ANALYTICS_PYTHON_IMAGE:?Pin the reviewed Python image digest}
    user: '1000:1000'
    entrypoint: [python3, -B, /opt/kasanova/analytics_ingress.py]
    command: [--config, /run/secrets/ingress.json, --journal, /var/lib/analytics/ingress.sqlite, --cloud-only, --delivery-enable-file, /var/lib/analytics/cloud-delivery.enabled]
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 512m
    volumes:
      - ./analytics_ingress.py:/opt/kasanova/analytics_ingress.py:ro
      - ./native_cloud_proxy.py:/opt/kasanova/native_cloud_proxy.py:ro
      - ${ANALYTICS_INGRESS_CONFIG:?Preserve the private client/project mappings}:/run/secrets/ingress.json:ro
      - journal:/var/lib/analytics
    networks: [analytics]
  gateway:
    image: ${ANALYTICS_CADDY_IMAGE:?Pin the reviewed Caddy image digest}
    entrypoint: [caddy]
    command: [run, --config, /etc/caddy/Caddyfile]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 128m
    volumes:
      - ./Caddyfile.cloud:/etc/caddy/Caddyfile:ro
    networks:
      analytics:
      caddy_caddy_net:
        # Controlled standby overlap requires the SAME journal and a disabled
        # new worker. Certify this gateway through its unique alias first.
        aliases: [kasanova_analytics_gateway, kasanova_posthog_gateway]
networks:
  analytics:
  caddy_caddy_net:
    external: true
volumes:
  journal:
    external: true
    name: ${ANALYTICS_JOURNAL_VOLUME:?Use the existing authoritative journal volume}
