name: kasanova_posthog
services:
  db:
    cgroup_parent: kasanova-posthog.slice
    restart: unless-stopped
    build: !reset null
    ports: !reset []
    labels:
      io.kasanova.service: posthog
      io.kasanova.source-revision: ${DEPLOYMENT_REVISION:?Set DEPLOYMENT_REVISION}
    volumes: !override
      - postgres-data:/var/lib/postgresql/data
      - ./posthog/docker/postgres-init-scripts:/docker-entrypoint-initdb.d:ro
      - ./posthog/products:/products:ro
  redis7:
    cgroup_parent: kasanova-posthog.slice
    restart: unless-stopped
    build: !reset null
    ports: !reset []
    labels:
      io.kasanova.service: posthog
      io.kasanova.source-revision: ${DEPLOYMENT_REVISION:?Set DEPLOYMENT_REVISION}
