    restart: unless-stopped
    build: !reset null
    ports: !reset []
    labels:
      io.kasanova.service: posthog
      io.kasanova.source-revision: ${DEPLOYMENT_REVISION:?Set DEPLOYMENT_REVISION}
  worker:
    cgroup_parent: kasanova-posthog.slice
    restart: unless-stopped
    build: !reset null
    ports: !reset []
    labels:
      io.kasanova.service: posthog
      io.kasanova.source-revision: ${DEPLOYMENT_REVISION:?Set DEPLOYMENT_REVISION}
    environment:
      OPT_OUT_CAPTURE: "true"
      DISABLE_SECURE_SSL_REDIRECT: "true"
      IS_BEHIND_PROXY: "true"
      TRUSTED_PROXIES: "172.18.0.0/16,127.0.0.1"
      SECURE_COOKIES: "true"
      ALLOWED_HOSTS: "posthog.kasanova.io,localhost,127.0.0.1,web"
      GUNICORN_CMD_ARGS: "--workers 2 --threads 2"
      CELERY_WORKER_CONCURRENCY: "2"
