name: chats_indexer_candidate

services:
  indexer:
    image: ${CHATS_INDEXER_IMAGE:?CHATS_INDEXER_IMAGE must be the tested image ID}
    pull_policy: never
    restart: unless-stopped
    environment:
      KASIA_INDEXER_DB_ROOT: /app/data
      KASPA_NODE_WBORSH_URL: ws://kaspad-testnet10:17210
      NETWORK_TYPE: testnet
      KASIA_API_BIND: 0.0.0.0:8080
      RUST_LOG: info
    # Candidate is only accessible over SSH/loopback, never the public route.
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - candidate_data:/app/data
    networks:
      - caddy_caddy_net
    stop_signal: SIGINT
    stop_grace_period: 90s
    mem_limit: 2g
    cpus: 2
    labels:
      io.kasanova.environment: dev-candidate
      io.kasanova.source-revision: ${DEPLOYMENT_REVISION:?DEPLOYMENT_REVISION is required}

volumes:
  candidate_data:

networks:
  caddy_caddy_net:
    external: true
