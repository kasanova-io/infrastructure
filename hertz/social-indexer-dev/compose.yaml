name: social_indexer_dev

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
  networks: [social]
  security_opt: [no-new-privileges:true]

services:
  database:
    <<: *service
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
      POSTGRES_DB: social
    command: [-c, shared_preload_libraries=pg_stat_statements]
    volumes: [social_data:/var/lib/postgresql/data]
    shm_size: 256m
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U social -d social']
      interval: 10s
      timeout: 5s
      retries: 10
  indexer:
    <<: *service
    image: ${CHAIN_INDEXER_IMAGE:?immutable digest required}
    networks: [social, caddy_caddy_net]
    command:
      - -s
      - ${KASPA_NODE_URL:?required}
      - -l
      - 0.0.0.0:8501
      - -n
      - ${SOCIAL_NETWORK:?required}
      - -d
      - postgres://social:${DB_PASSWORD:?required}@database:5432/social
      - --prune-db=0 * * * *
      - --retention=1h
      - --upgrade-db
      - --disable=virtual_chain_processing,transaction_acceptance,blocks_table,block_parent_table,transactions_inputs,transactions_outputs,addresses_transactions_table
      - --exclude-fields=block_accepted_id_merkle_root,block_merge_set_blues_hashes,block_merge_set_reds_hashes,block_selected_parent_hash,block_bits,block_blue_work,block_blue_score,block_daa_score,block_hash_merkle_root,block_nonce,block_pruning_point,block_timestamp,block_utxo_commitment,block_version,tx_subnetwork_id,tx_hash,tx_mass,tx_in_previous_outpoint,tx_in_signature_script,tx_in_sig_op_count,tx_out_amount,tx_out_script_public_key,tx_out_script_public_key_address
    depends_on:
      database: {condition: service_healthy}
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, "netstat -tuln | grep ':8501 ' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
  processor:
    <<: *service
    image: kasanova/social-processor:${SOURCE_REVISION:?required}
    pull_policy: never
    build:
      context: ../../vendor/k-indexer
      dockerfile: docker/DEV/Dockerfile.K-transaction-processor
      labels:
        org.opencontainers.image.revision: ${SOURCE_REVISION:?required}
    command: [--upgrade-db, --network, '${SOCIAL_NETWORK:?required}', --db-host, database, --db-port, '5432', --db-name, social, --db-user, social, --db-password, '${DB_PASSWORD:?required}', --db-max-connections, '6', --workers, '2']
    depends_on:
      indexer: {condition: service_healthy}
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, 'pgrep -f K-transaction-processor']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
  web:
    <<: *service
    image: kasanova/social-web:${SOURCE_REVISION:?required}
    pull_policy: never
    container_name: social_indexer_dev_web
    networks: [social, caddy_caddy_net]
    build:
      context: ../../vendor/k-indexer
      dockerfile: docker/DEV/Dockerfile.K-webserver
      labels:
        org.opencontainers.image.revision: ${SOURCE_REVISION:?required}
    command: [--db-host, database, --db-port, '5432', --db-name, social, --db-user, social, --db-password, '${DB_PASSWORD:?required}', --bind-address, '0.0.0.0:3001', --worker-threads, '2', --db-max-connections, '6', --request-timeout, '15', --rate-limit, '200']
    depends_on:
      processor: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3001/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  social_data:
networks:
  social:
    internal: true
  caddy_caddy_net:
    external: true
